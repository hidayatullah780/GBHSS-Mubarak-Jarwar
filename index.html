<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GBHSS Mubarak Jarwar</title>
  <meta name="description" content="GBHSS Mubarak Jarwar — Government Boys Higher Secondary School Mubarak Jarwar, Tando Allahyar. Educate • Empower • Excel">
  <meta name="theme-color" content="#0b2545">
<link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/images/logo.jpg" type="image/jpeg">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Apply saved theme before first paint to avoid a light/dark flash -->
  <script>
    try {
      var t = localStorage.getItem('gbhss-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>GBHSS Mubarak Jarwar needs JavaScript enabled to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
